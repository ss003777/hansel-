<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>헨젤과 그레텔: 숲속 과자길</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#315f4c,#071a13 64%);color:#f9f3dd;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font:clamp(27px,6vw,46px) Jua,sans-serif;margin:0}.hud{display:flex;gap:11px;background:#102e22;border:1px solid #7ca56b;border-radius:10px;padding:8px;font:16px Jua,sans-serif}.hud b{color:#ffd35a}.wrap{position:relative;border:5px solid #4d8058;border-radius:16px;overflow:hidden;margin-top:15px;box-shadow:0 16px 32px #0008}#board{aspect-ratio:17/15;display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(15,1fr);background:#143a28}.cell{display:grid;place-items:center;position:relative}.wall:after{content:'';position:absolute;inset:5%;background:linear-gradient(135deg,#356b4a,#173524);border:2px solid #8ab476;border-radius:5px}.candy,.ghost{z-index:2;font-size:clamp(10px,2.7vw,22px);filter:drop-shadow(0 0 4px #ffd44d)}.pac{width:65%;height:65%;background:#ffd451;border-radius:50%;z-index:3;clip-path:polygon(0 0,100% 30%,100% 70%,0 100%);animation:bite .25s steps(2) infinite}.gretel{background:#f7a4bc}.witch{background:#ad8ce6}@keyframes bite{50%{clip-path:polygon(0 0,100% 42%,100% 58%,0 100%)}}.overlay{position:absolute;inset:0;background:#061811e8;z-index:6;display:grid;place-items:center;padding:14px}.box{width:min(590px,100%);text-align:center;background:#123a28;border:1px solid #a8c77e;border-radius:18px;padding:22px}.box h2{font:29px Jua,sans-serif;margin:4px}.choices,.levels{display:flex;gap:8px;justify-content:center;margin:15px 0}.choice,.level,button{cursor:pointer;border:1px solid #719b68;border-radius:10px;background:#1f4c34;color:#eff7d9;padding:10px;font:15px system-ui}.choice{width:31%}.choice strong{display:block;font:21px Jua,sans-serif}.choice small,.level small{display:block;margin-top:3px;font-size:11px}.selected{border-color:#ffe38e;background:#f6c85b;color:#183025}.start{background:#f6c85b;color:#173323;font:20px Jua,sans-serif;padding:12px 22px}.rule{color:#f7d87e;min-height:22px}.controls,.reset{text-align:center;margin-top:13px}.controls button{width:48px;height:40px;margin:2px;font-size:18px}.reset button{padding:8px 14px}.hidden{display:none}.message p{font:28px Jua,sans-serif;margin:0 0 8px}.hint{text-align:center;color:#d7e5c5;font-size:13px}@media(max-width:520px){.app{padding:10px}.top{align-items:flex-start}.hud{font-size:12px;gap:6px}.choice{font-size:12px;padding:7px}.choice strong{font-size:17px}}
</style></head><body><main class="app"><header class="top"><h1>숲속 과자길</h1><div class="hud">점수 <b id="score">0</b> · 목표 <b id="left">0</b> · 시간 <b id="time">—</b> · 목숨 <b id="lives">3</b></div></header><section class="wrap"><div id="board"></div><div id="choose" class="overlay"><div class="box"><h2>주인공과 난이도를 골라요</h2><div class="choices"><button class="choice selected" data-char="hansel">🧒<strong>헨젤</strong><small>과자 수집</small></button><button class="choice" data-char="gretel">👧<strong>그레텔</strong><small>과자 수집</small></button><button class="choice" data-char="witch">🧙‍♀️<strong>마녀</strong><small>아이를 잡기</small></button></div><div class="levels"><button class="level selected" data-level="low">하<small>여유롭게</small></button><button class="level" data-level="mid">중<small>보통</small></button><button class="level" data-level="high">상<small>도전</small></button></div><p id="rule" class="rule">과자를 모두 먹고 마녀를 피하세요.</p><button id="start" class="start">게임 시작</button><p class="hint">방향키 또는 화면 버튼으로 이동</p></div></div><div id="result" class="overlay hidden"><div class="box message"><p id="title"></p><span id="copy"></span><p><button id="again" class="start">다시 하기</button></p></div></div></section><div class="controls"><button data-dir="up">▲</button><br><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="reset"><button id="reset">↻ 맵 초기화</button></div></main>
<script>
const M=['#################','#...............#','#.###.#####.###.#','#.#...#...#...#.#','#.#.###.#.###.#.#','#.....#.#.#.....#','#####.#...#.#####','#.....#.###.....#','#.###.#.....#.###','#...#.#####.#...#','###.#...#...#.###','#...###.#.###...#','#.###...#...###.#','#...............#','#################'];const D={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]},L={low:{n:1,t:75},mid:{n:2,t:55},high:{n:3,t:40}};const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),leftEl=document.querySelector('#left'),livesEl=document.querySelector('#lives'),timeEl=document.querySelector('#time'),chooseEl=document.querySelector('#choose'),resultEl=document.querySelector('#result'),titleEl=document.querySelector('#title'),copyEl=document.querySelector('#copy'),ruleEl=document.querySelector('#rule'),startBtn=document.querySelector('#start'),againBtn=document.querySelector('#again'),resetBtn=document.querySelector('#reset');let who='hansel',level='low',run=false,score=0,lives=3,time=0,me,food=[],bad=[],gt,ct;const P=(r,c)=>({r,c}),K=x=>x.r+','+x.c,E=(a,b)=>a.r==b.r&&a.c==b.c,O=x=>M[x.r]?.[x.c]&&M[x.r][x.c]!='#',N=x=>Object.values(D).map(d=>P(x.r+d[0],x.c+d[1])).filter(O),C=x=>document.querySelector(`[data-p="${K(x)}"]`);
function open(){let a=[];M.forEach((r,i)=>[...r].forEach((v,j)=>v!='#'&&a.push(P(i,j))));return a}function chase(a,b){let q=[a],pre=new Map([[K(a),null]]);for(let i=0;i<q.length;i++){if(E(q[i],b))break;N(q[i]).forEach(x=>{if(!pre.has(K(x)))pre.set(K(x),q[i]),q.push(x)})}let x=b;while(pre.get(K(x))&&!E(pre.get(K(x)),a))x=pre.get(K(x));return x}
function build(){board.innerHTML='';M.forEach((r,i)=>[...r].forEach((v,j)=>{let e=document.createElement('div');e.className='cell '+(v=='#'?'wall':'');e.dataset.p=i+','+j;board.append(e)}));me=P(13,1);if(who=='witch'){food=[P(1,1),P(1,15),P(13,15),P(7,7)].map((x,i)=>({...x,s:i%2?'👧':'🧒'}));bad=[{...P(1,7),s:'🍬'}];time=L[level].t}else{food=open().filter(x=>!E(x,me)).map(x=>({...x,s:'🍬'}));bad=[P(1,15),P(13,15),P(1,1)].slice(0,L[level].n).map(x=>({...x,s:'🧙‍♀️'}));time=0}paint()}
function paint(){document.querySelectorAll('.candy,.ghost,.pac').forEach(x=>x.remove());food.forEach(x=>{let e=document.createElement('span');e.className='candy';e.textContent=x.s;C(x).append(e)});bad.forEach(x=>{let e=document.createElement('span');e.className=who=='witch'?'candy':'ghost';e.textContent=x.s;C(x).append(e)});let h=document.createElement('i');h.className='pac '+(who=='gretel'?'gretel':who=='witch'?'witch':'');C(me).append(h);scoreEl.textContent=score;leftEl.textContent=food.length;livesEl.textContent=lives;timeEl.textContent=who=='witch'?time+'초':'—'}
function over(win,msg){run=false;clearInterval(gt);clearInterval(ct);resultEl.classList.remove('hidden');titleEl.textContent=win?'숲을 탈출했어요!':'동화가 끝났어요…';copyEl.textContent=msg}function hit(){if(who=='witch')return over(false,'사탕을 먹었어요.');if(--lives<1)return over(false,'마녀에게 붙잡혔어요.');me=P(13,1);bad=[P(1,15),P(13,15),P(1,1)].slice(0,L[level].n).map(x=>({...x,s:'🧙‍♀️'}));paint()}function move(a,b){if(!run)return;let n=P(me.r+a,me.c+b);if(!O(n))return;me=n;if(who=='witch'&&bad.some(x=>E(x,me)))return hit();let i=food.findIndex(x=>E(x,me));if(i>=0){food.splice(i,1);score+=10;if(!food.length)return over(true,'점수 '+score+'점!')}if(who!='witch'&&bad.some(x=>E(x,me)))hit();if(run)paint()}function ghosts(){if(!run||who=='witch')return;bad.forEach((x,i)=>Object.assign(x,chase(x,i?P(Math.max(1,me.r-2),me.c):me)));if(bad.some(x=>E(x,me)))hit();if(run)paint()}function startGame(){score=0;lives=3;resultEl.classList.add('hidden');chooseEl.classList.add('hidden');build();run=true;clearInterval(gt);clearInterval(ct);gt=setInterval(ghosts,430);if(who=='witch')ct=setInterval(()=>{if(--time<=0)over(false,'시간이 다 되었어요.');else paint()},1000)}
document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{document.querySelectorAll('.choice').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');who=x.dataset.char;ruleEl.textContent=who=='witch'?'아이 4명을 잡으세요. 사탕은 피하고, 난이도별 제한시간 안에 끝내세요.':'과자를 모두 먹고 난이도별 마녀 수를 피해요.'});document.querySelectorAll('.level').forEach(x=>x.onclick=()=>{document.querySelectorAll('.level').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');level=x.dataset.level});startBtn.onclick=startGame;againBtn.onclick=()=>{resultEl.classList.add('hidden');chooseEl.classList.remove('hidden')};resetBtn.onclick=()=>run?startGame():chooseEl.classList.remove('hidden');document.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();move(...D[d])}});document.querySelectorAll('[data-dir]').forEach(x=>x.onclick=()=>move(...D[x.dataset.dir]));
</script></body></html>
